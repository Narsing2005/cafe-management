{% extends 'base.html' %}
{% block title %}Login Error{% endblock %}
{% block bare %}
<div class="login-wrap">
  <div class="login-card" style="text-align:center">
    <div class="logo" style="color:var(--danger)"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1>Login Failed</h1>
    <p class="sub">{{ message }}</p>
    <a class="btn" href="{{ url_for('main.login') }}"><i class="fa-solid fa-arrow-left"></i> Try Again</a>
  </div>
</div>
{% endblock %}
