{% extends 'base.html' %}
{% block heading %}{{ 'Edit' if item else 'New' }} Menu Item{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px">
  <form method="post" enctype="multipart/form-data">
    <div class="form-row"><label>Name</label>
      <input type="text" name="name" required value="{{ item.name if item else '' }}"></div>
    <div class="form-row"><label>Category</label>
      <input type="text" name="category" required value="{{ item.category if item else '' }}" placeholder="Coffee, Tea, Bakery..."></div>
    <div class="form-row"><label>Price (₹)</label>
      <input type="number" step="0.01" min="0" name="price" required value="{{ item.price if item else '' }}"></div>
    <div class="form-row"><label>Description</label>
      <textarea name="description" rows="3">{{ item.description if item else '' }}</textarea></div>
    <div class="form-row"><label>Image (upload)</label>
      <input type="file" name="image" accept="image/*">
      {% if item and item.image %}<small style="color:var(--muted)">Current: {{ item.image }}</small>{% endif %}
    </div>
    <div class="form-row"><label>Or Image URL</label>
      <input type="url" name="image_url" placeholder="https://images.unsplash.com/..." value="{{ item.image if item and item.image and item.image.startswith('http') else '' }}">
    </div>
    {% if item %}
    <div class="form-row">
      <label><input type="checkbox" name="available" {% if item.available %}checked{% endif %}> Available</label>
    </div>
    {% endif %}
    <button class="btn"><i class="fa-solid fa-save"></i> Save</button>
    <a class="btn ghost" href="{{ url_for('main.menu') }}">Cancel</a>
  </form>
</div>
{% endblock %}
